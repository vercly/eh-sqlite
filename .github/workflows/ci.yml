name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Test with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
